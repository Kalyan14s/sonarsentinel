name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest with coverage
        run: pytest --cov=sonarsentinel --cov-report=term-missing
      - name: CLI smoke test
        run: sonarsentinel --help

  docs:
    name: Documentation checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify links, anchors, IDs and wireframe frames
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/docs/verify_docs.ps1

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend yet (planned for Sprint 3, ST-090): skipping."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, type-check and build
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci && npm run lint && npm run typecheck && npm run build
