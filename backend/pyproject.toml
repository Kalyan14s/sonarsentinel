[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarsentinel"
version = "0.1.0"
description = "AI-powered detection and geotagging of marine debris and ghost nets in side-scan sonar imagery (SIH 2026 PS 26057)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "SonarSentinel team" }]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
  "jsonschema>=4.21",
]
geo = [
  "scipy>=1.11",
  "rasterio>=1.3",
  "shapely>=2.0",
  "opencv-python-headless>=4.9",
  "pyxtf>=1.4",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
]

[project.scripts]
sonarsentinel = "sonarsentinel.cli:app"

[tool.setuptools.packages.find]
include = ["sonarsentinel*"]

[tool.setuptools.package-data]
"sonarsentinel.report" = ["schema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sonarsentinel"]

[[tool.mypy.overrides]]
module = ["pyxtf.*", "rasterio.*", "sahi.*", "ultralytics.*", "anomalib.*", "pandas.*", "pyproj.*", "scipy.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests"]

[tool.coverage.run]
source = ["sonarsentinel"]
