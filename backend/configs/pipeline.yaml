# SonarSentinel pipeline configuration.
# Reference: docs/architecture/02-data-pipeline.md section 6. Model files are created from Sprint 3.
pipeline_version: 0.2.0             # 0.2.0: Sprint 4 scoring (shadow, features, fusion, calibration), layback, chips

ingest:
  max_upload_gb: 2
  image_layout: port_stbd          # port_stbd | port_only | stbd_only
  utm_epsg: auto                   # or e.g. 32644

navigation:
  smoothing_window_pings: 31
  heading_smoothing_window_pings: 25
  max_speed_mps: 6.0
  apply_layback: auto              # auto | true | false (auto: only when the file has ship positions only)
  manual_layback_m: null           # operator layback in metres; overrides file values and estimates
  tow_point_height_m: 0.0          # vertical term in layback = sqrt(L² − (d − tow_point_height)²) + antenna_to_tow_point
  antenna_to_tow_point_m: 0.0      # horizontal GNSS antenna → tow point distance

preprocess:
  ground_resolution_m: 0.10
  bottom_tracking: { enabled: auto, threshold_k: 3.0, median_window: 31 }
  gain: { along_track_window_pings: 200, per_side: true, clip_percentiles: [1, 99.5] }
  despeckle: { method: lee, window: 5 }
  local_std_window: 7
  dropout: { min_row_std_ratio: 0.05, max_inpaint_gap_pings: 3 }
  motion: { max_roll_deg: 5, max_pitch_deg: 5, max_yaw_rate_deg_per_ping: 3 }
  surface_return_mask: false       # true: drop linear track-parallel detections in the surface-return band (all in-band detections are flagged)
  surface_return_tolerance_m: 0.5

tiling:
  size_px: 640
  overlap: 0.25
  skip_if_masked_fraction_gt: 0.8

chunking:
  pings_per_chunk: 2000
  overlap_pings: 200

detection:
  model: models/detector/yolo11s-seg-sonar-real/0.1.0/best.pt   # CPU baseline (EXP-20260913-baseline)
  runtime: auto                    # auto | torch | onnxruntime | cuda | tensorrt (GPU runtimes fall back to CPU with CPU_FALLBACK)
  min_raw_score: 0.20
  sahi: true
  classes: [shipwreck, pipe, cylinder, ghost_net, debris_other]

anomaly:
  enabled: true
  model: models/anomaly/patchcore-seafloor/0.1.0                 # EXP-20260913-patchcore
  tile_px: 256
  threshold: 0.50
  min_region_m2: 0.25

scoring:
  weights: { detector: 0.45, anomaly: 0.15, shadow: 0.15, fp_filter: 0.15, persistence: 0.10 }
  penalties: { dropout: 0.20, motion: 0.10 }
  fp_filter_model: models/fp_filter/lgbm-fp/0.1.0          # folder with model.txt + model.json (ml/train_fp_filter.py)
  calibrator: models/calibrator/isotonic/0.1.0/calibrator.json   # JSON breakpoints (ml/calibrate.py)
  tiers: { hazard: 80, review: 50, anomaly: 30 }

geo:
  datum: WGS84
  cluster_radius_m: 5
  coordinate_decimals: 6
  uncertainty:                     # 1-σ horizontal budget (04 §8, ADR-018): RSS of the terms below
    gnss_m: 2.0                    # standalone GNSS; ~0.5 with SBAS, ~0.05 with RTK
    heading_deg: 2.0               # heading error → ground_range · sin(σ)
    altitude_m: 0.5                # altitude error → σ · altitude / ground_range
    time_s: 0.2                    # ping time error → speed · σ
    layback_fraction: 0.10         # of the estimated layback (0 when layback is measured or manual)

report:
  formats: [json, csv, geojson, kml]
  chip_size_px: 256
  mosaic: true                     # GCP mosaic under results/<survey_id>/ when a results folder is given (ST-036)
  mosaic_ground_res_m: 0.25

jobs:
  max_job_seconds: 3600            # SS_JOB_TIMEOUT_S; a longer job fails with JOB_TIMEOUT (0 disables)

api:                               # overridden by SS_* environment variables (ADR-019)
  keep_work_files: false           # SS_KEEP_WORK_FILES
  log_level: INFO                  # SS_LOG_LEVEL
  workers: 1                       # SS_WORKERS (only 1 is supported)
  # offline_tiles: tiles/basemap.mbtiles   # SS_OFFLINE_TILES
