# Install once per clone:  pre-commit install
# Update hook versions:    pre-commit autoupdate
# LICENSE must stay byte-identical to the official AGPL-3.0 text; deck files are generated binaries.
exclude: ^(LICENSE|docs/hackathon/idea-deck/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|scripts)/
      - id: ruff-format
        files: ^(backend|scripts)/
